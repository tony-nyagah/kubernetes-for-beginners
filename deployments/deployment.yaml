apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  labels:
    tier: frontend
    app: myapp
spec:
  selector:
    matchLabels:
      app: myapp
  replicas: 6
  template:
    metadata:
        name: caddy
        labels:
          app: myapp
    spec:
      containers:
        - name: caddy
          image: caddy:2.11.8
